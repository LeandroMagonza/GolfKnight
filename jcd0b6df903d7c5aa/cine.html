<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golf Knight · Intro</title>
    <style>html,body{color:#eee;-webkit-user-select:none;user-select:none;background:#000;height:100%;margin:0;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}#layer{pointer-events:none;position:fixed;inset:0;overflow:hidden}.bar{z-index:3;background:#000;height:max(0px,50vh - 22.7273vw);position:absolute;left:0;right:0}.bar.top{top:0}.bar.bottom{bottom:0}.veil{opacity:0;z-index:2;position:absolute;inset:0}.cue{opacity:0;z-index:4;position:absolute}.cue.caption{text-align:center;color:#f2ead8;text-shadow:0 2px 4px #000;width:min(900px,90vw);font-size:clamp(16px,2.2vw,24px);bottom:max(18px,25vh - 11.3636vw - 14px);left:50%;transform:translate(-50%)}.cue.say{color:#1a1a1a;text-align:center;z-index:1;background:#fffaf0;border-radius:16px;max-width:320px;padding:10px 16px;font-size:clamp(14px,1.6vw,19px);line-height:1.35;transform:translate(-50%,-100%);box-shadow:0 4px 14px #00000059}.cue.say:after{content:"";border:8px solid #0000;border-top:12px solid #fffaf0;border-bottom:0;position:absolute;bottom:-12px;left:50%;transform:translate(-50%)}.cue.card{text-align:center;color:#e8e2d4;font:italic 400 clamp(22px,3.2vw,40px) Georgia,serif;top:50%;left:0;right:0;transform:translateY(-50%)}.cue.title{text-align:center;letter-spacing:6px;color:#ffd66b;text-shadow:0 4px #7a4b12,0 0 30px #ffc85a80;font:700 clamp(44px,8vw,110px) Georgia,serif;top:50%;left:0;right:0;transform:translateY(-50%)}#start{z-index:10;background:#05070b;flex-direction:column;justify-content:center;align-items:center;gap:16px;display:flex;position:fixed;inset:0}#start[hidden]{display:none}#start h1{color:#ffd66b;margin:0;font:700 44px Georgia,serif}#start p{color:#9aa4b2;margin:0}#start button,#controls button{color:#102;cursor:pointer;background:#5be07a;border:0;border-radius:8px;padding:10px 26px;font-size:17px;font-weight:600}#start button:disabled{color:#aab;cursor:wait;background:#556}#controls{z-index:8;opacity:0;background:#080c12d9;align-items:center;gap:10px;padding:8px 14px;font-size:13px;transition:opacity .2s;display:flex;position:fixed;bottom:0;left:0;right:0}#controls:hover,body.paused #controls{opacity:1}#controls button{color:#e4e9f0;background:#2c3644;padding:5px 12px;font-size:13px}#controls input{flex:1}#controls .time{font-variant-numeric:tabular-nums;color:#cfd6e0;min-width:150px}#controls a{color:#9aa4b2}#skipcine{z-index:12;color:#e4e9f0;cursor:pointer;background:#080c128c;border:1px solid #ffffff59;border-radius:8px;padding:8px 18px;font-size:15px;position:fixed;top:14px;right:16px}#skipcine:hover{color:#ffd66b;background:#080c12d9}</style>
    <script type="module" crossorigin src="./assets/cine-BPzFVxg5.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/swingPose-BsqiN1r5.js">
    <link rel="modulepreload" crossorigin href="./assets/models-ZPC8qZZy.js">
  </head>
  <body>
    <div id="layer"><div class="bar top"></div><div class="bar bottom"></div></div>
    <button id="skipcine" type="button" data-en="Skip ⏭ (Esc)">Saltar ⏭ (Esc)</button>
    <div id="start">
      <h1 translate="no">Golf Knight</h1>
      <p id="status" data-en="Loading models…">Cargando modelos…</p>
      <button id="play" disabled data-en="Watch the intro">Ver la intro</button>
    </div>
    <div id="controls">
      <button id="toggle" data-en="Pause">Pausa</button>
      <input id="scrub" type="range" min="0" step="0.01" value="0" />
      <span class="time" id="time"></span>

    </div>
    <!-- el idioma, antes que los módulos (ver docs/localizacion.md) -->
    <script src="./lang.js"></script>
  </body>
</html>
