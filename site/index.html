<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golf Knight</title>
  <meta name="description" content="Golf Knight se mudó a itch.io: la demo gratis en el navegador y el juego completo para Windows.">
  <link rel="icon" href="icono.png">
  <!--
    La página de antes del juego (8/10): Golf Knight se juega en itch.io. Acá quedan Abe (abe/p<N>/, ver
    NET_PROTOCOL en src/net/snapshot.ts) y, con contraseña, la completa para los que ayudan a probarlo.
    La arma tools/deploy.mjs: copia esta carpeta y le suma los banners, Abe y la completa.
  -->
  <script>
    // los enlaces viejos para ser Abe venían a esta dirección: van al Abe de esa época (el protocolo 1)
    if (/[?&](mirar|transmitir)=/.test(location.search)) location.replace(`abe/p1/${location.search}${location.hash}`);
  </script>
  <style>
    :root {
      --bg: #0b1626; --panel: #13233a; --text: #f3ead6; --muted: #b9c2cf; --gold: #ffd66b; --gold-dark: #c98a1e;
      --line: rgba(255, 214, 107, 0.28); --bad: #ff8a7a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .banner { display: block; width: 100%; aspect-ratio: 1920 / 600; object-fit: cover; background: #2d6b2f; }
    main { max-width: 680px; margin: 0 auto; padding: 28px 16px 48px; }
    .lang { float: right; margin-top: 2px; }
    .lang button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 4px 6px; }
    .lang button[aria-pressed="true"] { color: var(--gold); text-decoration: underline; }
    h1 { font: 700 clamp(26px, 5vw, 36px)/1.2 Georgia, serif; color: var(--gold); margin: 0 0 12px; }
    p { margin: 0 0 14px; }
    .muted { color: var(--muted); font-size: 15px; }
    .play { display: inline-block; margin: 8px 0 26px; padding: 14px 26px; border-radius: 10px; background: linear-gradient(180deg, #ffe9a0, var(--gold) 55%, var(--gold-dark));
      color: #3b1f05; font: 700 20px Georgia, serif; text-decoration: none; box-shadow: 0 3px 0 #6b3f0c, 0 6px 18px rgba(0, 0, 0, 0.35); }
    .play:hover { filter: brightness(1.06); }
    details { margin-top: 30px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 16px; }
    summary { cursor: pointer; color: var(--muted); }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    input { flex: 1 1 200px; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
    form button { padding: 10px 18px; border-radius: 8px; border: 0; background: var(--gold); color: #3b1f05; font: 700 16px system-ui, sans-serif; cursor: pointer; }
    .error { color: var(--bad); font-size: 15px; margin: 8px 0 0; min-height: 1.4em; }
  </style>
</head>
<body>
  <img class="banner" id="banner" src="banner-es.png" alt="Golf Knight: el caballero pega con el palo de golf mientras la horda viene por el campo">
  <main>
    <div class="lang"><button type="button" data-lang="es">Español</button> · <button type="button" data-lang="en">English</button></div>
    <h1 data-es="Golf Knight se mudó a itch.io" data-en="Golf Knight moved to itch.io">Golf Knight se mudó a itch.io</h1>
    <p data-es="Ahora se juega en itch.io: la demo, gratis en el navegador, y el juego completo para Windows."
       data-en="It's played on itch.io now: the free demo in your browser, and the full game for Windows.">Ahora se juega en itch.io: la demo, gratis en el navegador, y el juego completo para Windows.</p>
    <a class="play" href="https://forja-de-almas.itch.io/golf-knight" data-es="Jugar en itch.io" data-en="Play on itch.io">Jugar en itch.io</a>
    <p class="muted" data-es="¿Te invitaron a ser Abe, el mago? Abrí el enlace que te pasaron: eso sigue andando acá."
       data-en="Invited to play as Abe, the wizard? Open the link you got: that still works here.">¿Te invitaron a ser Abe, el mago? Abrí el enlace que te pasaron: eso sigue andando acá.</p>
    <details>
      <summary data-es="¿Ayudás a probarlo? Entrá con la contraseña" data-en="Helping test it? Enter with the password">¿Ayudás a probarlo? Entrá con la contraseña</summary>
      <form id="friends">
        <input id="password" type="password" autocomplete="current-password" aria-label="Contraseña" data-es-label="Contraseña" data-en-label="Password">
        <button type="submit" data-es="Entrar" data-en="Enter">Entrar</button>
      </form>
      <p class="error" id="error" role="alert"></p>
    </details>
  </main>
  <script>
    const TEXTS = { wrong: { es: 'Esa no es la contraseña.', en: "That's not the password." }, offline: { es: 'No se pudo comprobar: probá de nuevo.', en: "Couldn't check it: try again." } };
    let lang = (() => {
      try { const saved = localStorage.getItem('gk.lang'); if (saved === 'es' || saved === 'en') return saved; } catch { /* sin almacenamiento */ }
      return navigator.language?.toLowerCase().startsWith('es') ? 'es' : 'en';
    })();
    function apply() {
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll('[data-es]')) el.textContent = el.dataset[lang];
      for (const el of document.querySelectorAll('[data-es-label]')) el.setAttribute('aria-label', el.dataset[`${lang}Label`]);
      for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      document.getElementById('banner').src = `banner-${lang}.png`;
      document.getElementById('error').textContent = '';
    }
    for (const b of document.querySelectorAll('.lang button')) {
      b.addEventListener('click', () => {
        lang = b.dataset.lang;
        try { localStorage.setItem('gk.lang', lang); } catch { /* sin almacenamiento */ }
        apply();
      });
    }
    apply();

    // La completa, para los que ayudan a probar: vive en una carpeta que sale de la contraseña (la misma
    // cuenta que hace tools/deploy.mjs). La contraseña no está en ningún lado de la página.
    async function folderFor(password) {
      const clean = password.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`golfknight:${clean}`));
      return `j${[...new Uint8Array(hash)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 16)}`;
    }
    async function exists(folder) {
      const res = await fetch(`${folder}/index.html`, { method: 'HEAD', cache: 'no-store' });
      return res.ok;
    }
    const KEY = 'gk.amigos';
    // el que ya entró una vez va directo
    (async () => {
      let folder = null;
      try { folder = localStorage.getItem(KEY); } catch { /* sin almacenamiento */ }
      if (folder && /^j[0-9a-f]{16}$/.test(folder) && await exists(folder).catch(() => false)) location.replace(`${folder}/`);
    })();
    document.getElementById('friends').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      const password = document.getElementById('password').value;
      if (!password.trim()) return;
      try {
        const folder = await folderFor(password);
        if (!await exists(folder)) { error.textContent = TEXTS.wrong[lang]; return; }
        try { localStorage.setItem(KEY, folder); } catch { /* sin almacenamiento */ }
        location.href = `${folder}/`;
      } catch {
        error.textContent = TEXTS.offline[lang];
      }
    });
  </script>
</body>
</html>
